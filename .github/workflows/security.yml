name: Security

on:
  pull_request_target:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerability-checks:
    if: >-
      ${{
        github.repository == 'Arconath/abra' &&
        (
          (github.event_name == 'pull_request_target' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == github.event.repository.default_branch)
          ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
           github.ref_protected == true)
        )
      }}
    runs-on:
      group: arconath-jit
      labels: [self-hosted, linux, x64, arconath-jit, rootless-buildkit]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

      - name: Check npm vulnerabilities
        run: npm audit --audit-level=high

      - name: Run pinned open-source Gitleaks CLI
        run: ./scripts/check-gitleaks.sh
