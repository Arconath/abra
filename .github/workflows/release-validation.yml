name: Release validation (no publication)

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abra-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact source without publishing
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: arconath-jit
      labels: [self-hosted, linux, x64, arconath-jit, rootless-buildkit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # A read-only checkout credential is needed only for the protected
          # main ancestry fetch; remove it before any product code runs.
          persist-credentials: true
      - name: Verify protected source revision
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git config --local --unset-all http.https://github.com/.extraheader
      - name: Run dry release gate
        run: npm run release:gate:dry-run
      - name: Handoff exact source to central release control
        run: |
          printf '%s\n' \
            'Validation complete. Arconath/release-control is the only publisher and signer.' \
            'Create a reviewed signed intent for this exact commit and Git tree.'
